include "environments.conf"
include "workloads.conf"
include "thresholds.conf"

env = prod
env = ${?ENV}

workload = smoke
workload = ${?WORKLOAD}

scenario = ""
scenario = ${?SCENARIO}

threshold = ""
threshold = ${?THRESHOLD}

pause {
  min = 2s
  max = 6s
}

maxDuration = 1h

sessionLoop {
  duration = 1m
}

gatling {
  core {
    runDescription = "Pet Store performance test"
    encoding = "utf-8"
  }
  charting {
    indicators {
      lowerBound = 800
      higherBound = 1500
    }
  }
}
