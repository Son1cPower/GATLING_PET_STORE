env = prod
env = ${?ENV}

scenario = storeOrder
scenario = ${?SCENARIO}

profile = smoke
profile = ${?PROFILE}

environments {
  prod {
    baseUrl = "https://petstore.swagger.io/v2"
    dataDir = "data/prod"
  }
  test {
    baseUrl = "https://petstore.swagger.io/v2"
    dataDir = "data/test"
  }
}

pause {
  min = 2s
  max = 6s
}

maxDuration = 1h

profiles {
  smoke {
    users = 1
  }
  load {
    rate = 5
    rampUp = 30s
    duration = 2m
  }
  stress {
    startRate = 2
    increment = 2
    steps = 5
    stepDuration = 30s
    rampBetweenSteps = 10s
  }
  spike {
    baseRate = 2
    spikeUsers = 50
    duration = 1m
  }
  soak {
    rate = 2
    rampUp = 1m
    duration = 30m
  }
}

sla {
  p95Ms = 1500
  p99Ms = 3000
  maxFailedPercent = 1.0
}
