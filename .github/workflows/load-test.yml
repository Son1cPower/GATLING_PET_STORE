name: Load test

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Workload from application.conf
        type: choice
        options: [smoke, testLoad, baseLoad, highLoad, baseLoadOpen, highLoadOpen]
        default: smoke
      scenario:
        description: Scenario keys, comma-separated (empty = all scenarios of the workload)
        default: ""
      env:
        description: Target environment
        type: choice
        options: [prod, test]
        default: prod

jobs:
  gatling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Gatling
        env:
          WORKLOAD: ${{ inputs.workload }}
          SCENARIO: ${{ inputs.scenario }}
          ENV: ${{ inputs.env }}
        run: ./gradlew :load-tests:gatlingRun

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report-${{ inputs.workload }}-${{ github.run_number }}
          path: load-tests/build/reports/gatling/
